name: CI

on:
  push:
    branches: [ master ]
    tags: '*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'maven'

      - name: Build with Maven
        run: mvn package jacoco:report

      - name: Upload Codecov report
        uses: codecov/codecov-action@v7
        with:
          directory: .

      - name: Upload built JAR
        uses: actions/upload-artifact@v7
        with:
          name: jmail-jar
          path: target/jmail-*.jar

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'maven'

      - name: Run jmail benchmarks
        run: mvn test -Djmail.benchmark=true -Dtest=BenchmarkRunnerTest

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: target/jmh-jmail.json


  create-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ build ]

    steps:
      - uses: actions/checkout@v7
      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: jmail-jar
          path: target

      - name: Set tag number
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release notes file
        run: sed '/^## ${{ steps.tag.outputs.tag_name }}/,/^---/!d;//d' CHANGELOG.md > release_body.md

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body_path: release_body.md

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/jmail-${{ steps.tag.outputs.tag_name }}.jar
          asset_name: jmail-${{ steps.tag.outputs.tag_name }}.jar
          asset_content_type: application/java-archive
